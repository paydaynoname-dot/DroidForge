name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download official scrcpy runtime
        shell: pwsh
        run: ./scripts/download-scrcpy.ps1
      - name: Publish self-contained Windows app
        run: dotnet publish DroidForge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/DroidForge
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path artifacts/DroidForge/* -DestinationPath artifacts/DroidForge-win-x64.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidForge-win-x64
          path: artifacts/DroidForge-win-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/DroidForge-win-x64.zip
          generate_release_notes: true
